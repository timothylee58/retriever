name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retriever
          POSTGRES_PASSWORD: retriever
          POSTGRES_DB: retriever_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retriever"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./api[dev]"
      - run: pytest api/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://retriever:retriever@localhost:5432/retriever_test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
