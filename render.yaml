# Retriever on Render. Neon is external — set secrets in the dashboard.
services:
  - type: web
    name: retriever-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: HITPAY_API_KEY
        sync: false
      - key: HITPAY_WEBHOOK_SALT
        sync: false
      - key: HITPAY_WEBHOOK_URL
        sync: false
      - key: HITPAY_ENV
        value: sandbox
      - key: HITPAY_API_BASE
        value: https://api.sandbox.hit-pay.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: grok-4-fast
      - key: LLM_BASE_URL
        value: https://api.x.ai/v1

  - type: web
    name: retriever-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://retriever-api-mifm.onrender.com
      - key: DEMO_PASSWORD
        sync: false

