services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: retriever
      POSTGRES_PASSWORD: retriever
      POSTGRES_DB: retriever
    ports:
      - "5432:5432"
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://retriever:retriever@db:5432/retriever
      DRY_RUN: "true"
    ports:
      - "8000:8000"
    depends_on:
      - db
  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      DEMO_PASSWORD: retriever-demo
    ports:
      - "3000:3000"
    depends_on:
      - api
